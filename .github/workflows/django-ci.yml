name: Django CI

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    name: Django check
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DJANGO_SETTINGS_MODULE: "schedule_api.settings"
      DJANGO_SECRET_KEY: "ci-secret-key"
      DJANGO_DEBUG: "False"
      DB_ENGINE: "django.db.backends.sqlite3"
      DB_NAME: "db.sqlite3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install libs
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Check Django settings
        run: |
          source .venv/bin/activate
          python manage.py check

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    needs: build
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DJANGO_SETTINGS_MODULE: "schedule_api.settings"
      DJANGO_SECRET_KEY: "ci-secret-key"
      DJANGO_DEBUG: "False"
      DB_ENGINE: "django.db.backends.sqlite3"
      DB_NAME: "db.sqlite3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install libs
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run flake8
        run: |
          source .venv/bin/activate
          python -m pip install flake8
          python -m flake8 . --count --show-source --statistics --exclude .venv

  migrations:
    name: Check migrations
    runs-on: ubuntu-latest
    needs: lint
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DJANGO_SETTINGS_MODULE: "schedule_api.settings"
      DJANGO_SECRET_KEY: "ci-secret-key"
      DJANGO_DEBUG: "False"
      DB_ENGINE: "django.db.backends.sqlite3"
      DB_NAME: "db.sqlite3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install libs
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Check Django migrations
        run: |
          source .venv/bin/activate
          python manage.py makemigrations --check --dry-run

  tests:
    name: Django tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DJANGO_SETTINGS_MODULE: "schedule_api.settings"
      DJANGO_SECRET_KEY: "ci-secret-key"
      DJANGO_DEBUG: "False"
      DB_ENGINE: "django.db.backends.sqlite3"
      DB_NAME: "db.sqlite3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install libs
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run Django tests
        run: |
          source .venv/bin/activate
          python manage.py test
